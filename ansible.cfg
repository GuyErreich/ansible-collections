[defaults]
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections
inventory = inventory
host_key_checking = False
retry_files_enabled = False
stdout_callback = ansible.builtin.default
callback_result_format = yaml
interpreter_python = auto_silent
local_tmp = /tmp/ansible-guyerreich-local
# Optional: use the clean-msg callback when installed
# stdout_callback = guyerreich.outputs.default_with_clean_msg

[privilege_escalation]
# Prefer --ask-become-pass locally when needed; CI sets ANSIBLE_BECOME_ASK_PASS=False
become_ask_pass = False
