name: Publish Release - Production

on:
  push:
    tags:
      - "*.*.*"
      - "!*.*.*-rc"
      - "!*.*.*-dev"

concurrency:
  group: publish-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create production release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: GH Release
        uses: ./.github/actions/gh-release
        with:
          github_token: ${{ steps.app-token.outputs.token }}

  publish-galaxy:
    name: Publish ${{ matrix.collection }} to Galaxy
    needs: release
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        collection: [outputs, workstation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Build and publish
        working-directory: collections/ansible_collections/guyerreich/${{ matrix.collection }}
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${GALAXY_API_KEY:-}" ]]; then
            echo "GALAXY_API_KEY secret is not set" >&2
            exit 1
          fi
          ansible-galaxy collection build --output-path dist
          ansible-galaxy collection publish dist/*.tar.gz --token "$GALAXY_API_KEY"
