name: Publish Release - Staging

on:
  push:
    tags:
      - "*.*.*-rc"

concurrency:
  group: publish-staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create prerelease
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: GH Release
        uses: ./.github/actions/gh-release
        with:
          github_token: ${{ github.token }}
